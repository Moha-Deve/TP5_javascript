<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Restaurant TP5</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- PARTIE 1 : HEADER (Membre 1) -->
    <header id="header-section">
        <h1>Bienvenue au Restaurant Le Délicieux</h1>
    <nav>
        <ul>
            <li><a href="#accueil">Accueil</a></li>
            <li><a href="#menu">Menu</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>
        <!-- Membre 1 va coder ici -->
    </header>

    <!-- PARTIE 2 : MENU (Membre 2) -->
    <main id="main-section">
        <!-- Membre 2 va coder ici -->

    <h2>Commander un plat</h2>
    
    <form>
      <!-- Liste déroulante des plats -->

        <label for="dish-select">Choisissez votre plat :</label>
        <select id="dish-select" required>
          <option value="">-- Sélectionnez un plat --</option>
          <option value="1">Tajine de Poulet - 65 MAD</option>
          <option value="2">Couscous Royal - 80 MAD</option>
          <option value="3">Pastilla au Poulet - 70 MAD</option>
          <option value="4">Salade Marocaine - 35 MAD</option>
        </select>

      <!-- Champ Quantité -->
      
        <label for="quantity">Quantité :</label>
        <input type="number" id="quantity" value="1" min="1" max="10" required>
     
      <!-- Bouton de validation -->
      <button type="submit" class="btn-submit">Ajouter à la commande</button>
    </form>

    </main>

    <!-- PARTIE 3 : FOOTER (Membre 3) -->
    <footer id="footer-section">
        <!-- Membre 3 va coder ici -->
        <p>contact:0735648901</p>
        <p>email:restaurantluxe@restaurant.ma</p>
        <p class="copyright">Copyright &copy; 2023 Restaurant luxe. Tous droits réservés.</p>
    </footer>

</body>
</html>
